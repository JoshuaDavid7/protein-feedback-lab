name: Tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install '.[dev]'
      - run: ruff check src tests
      - run: pytest -q

